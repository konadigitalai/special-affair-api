name: Backend checks
on:
  pull_request:
  push:
    branches: [main, dev]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: sa_test
          POSTGRES_PASSWORD: local-test-only
          POSTGRES_DB: sf_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      ENVIRONMENT: dev
      DATABASE_URL: postgresql+asyncpg://sa_test:local-test-only@127.0.0.1:5432/sf_test
      DATABASE_MIGRATION_URL: postgresql+asyncpg://sa_test:local-test-only@127.0.0.1:5432/sf_test
      TEST_DATABASE_URL: postgresql+asyncpg://sa_test:local-test-only@127.0.0.1:5432/sf_test
      AUTH0_DOMAIN: example.auth0.com
      AUTH0_AUDIENCE: https://api.example.test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -e '.[dev]'
      - run: python -m compileall -q app scripts
      - run: ruff check --select E9,F63,F7,F82 app tests scripts
      - run: mypy app tests
      - run: alembic upgrade head
      - run: python -m scripts.enable_semantic_search
      - run: pytest -q
      - run: python -m scripts.export_openapi .test-artifacts/openapi.json
      - uses: actions/upload-artifact@v4
        with:
          name: special-affair-openapi-${{ github.sha }}
          path: .test-artifacts/openapi.json
